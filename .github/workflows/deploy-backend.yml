name: Deploy backend

# Aplica migrations Prisma no Postgres do cliente (quando os secrets existem).
# Secrets no GitHub:
#   DATABASE_URL  — connection string do tenant
#   (opcional, legado) SUPABASE_ACCESS_TOKEN + PROJECT_REF para as edge functions antigas

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma migrate deploy
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Skip notice
        if: ${{ secrets.DATABASE_URL == '' }}
        run: echo "DATABASE_URL não configurado — pulando migrate."
